<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 2: What is the value of money?</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Inter:wght@300;400;600&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; /* Slate 950 */
            color: #f8fafc; 
            overflow-x: hidden;
        }
        
        h1, h2, h3, .font-display { font-family: 'Montserrat', sans-serif; }

        .fade-in { animation: fadeIn 0.8s ease-in-out forwards; }
        .slide-up { animation: slideUp 0.6s ease-out forwards; opacity: 0; transform: translateY(30px); }
        .delay-1 { animation-delay: 0.15s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.45s; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* Floating Money Background Effect */
        .money-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
            opacity: 0.05;
        }

        .coin {
            position: absolute;
            color: #fbbf24; /* Amber 400 */
            font-size: 2rem;
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .glow-text { text-shadow: 0 0 15px rgba(52, 211, 153, 0.5); }
        .glow-box { box-shadow: 0 0 30px rgba(52, 211, 153, 0.2); }

        .theme-bg {
            background-image: linear-gradient(to bottom, rgba(2, 6, 23, 0.85), rgba(2, 6, 23, 0.95)), url('https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="theme-bg">
    <div class="money-bg" id="money-bg">
        <!-- Coins injected via JS -->
    </div>
    
    <div id="root" class="relative z-10 min-h-screen"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const BackgroundCoins = () => {
            useEffect(() => {
                const container = document.getElementById('money-bg');
                if(!container) return;
                const symbols = ['fa-coins', 'fa-dollar-sign', 'fa-euro-sign', 'fa-pound-sign', 'fa-yen-sign'];
                
                for(let i = 0; i < 20; i++) {
                    const coin = document.createElement('i');
                    coin.className = `fas ${symbols[Math.floor(Math.random() * symbols.length)]} coin`;
                    coin.style.left = `${Math.random() * 100}vw`;
                    coin.style.animationDuration = `${Math.random() * 15 + 10}s`;
                    coin.style.animationDelay = `${Math.random() * 5}s`;
                    coin.style.fontSize = `${Math.random() * 2 + 1}rem`;
                    container.appendChild(coin);
                }
            }, []);
            return null;
        };

        const ScratchItemCard = ({ title, desc, imageUrl, price, tag, isRevealed, onReveal }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                gradient.addColorStop(0, '#047857'); // Emerald 700
                gradient.addColorStop(1, '#0f766e'); // Teal 700
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.font = 'bold 20px Montserrat';
                ctx.textAlign = 'center';
                ctx.fillText('SCRATCH TO REVEAL', canvas.width / 2, canvas.height / 2 + 7);
            }, []);

            const startDrawing = (e) => {
                if (isRevealed) return;
                setIsDrawing(true);
                scratch(e);
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const scratch = (e) => {
                if (!isDrawing || isRevealed) return;
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                const x = (clientX - rect.left) * scaleX;
                const y = (clientY - rect.top) * scaleY;

                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 30, 0, Math.PI * 2);
                ctx.fill();
            };

            return (
                <div className="relative rounded-3xl p-6 md:p-8 border-2 border-slate-700 bg-slate-900/90 shadow-2xl flex flex-col items-center text-center overflow-hidden">
                    <div className="relative w-48 h-48 rounded-2xl overflow-hidden mb-6 shadow-inner border-2 border-slate-700 bg-slate-950 flex items-center justify-center">
                        {/* Hidden Content */}
                        <div className="absolute inset-0 flex flex-col items-center justify-center p-4">
                            <img 
                                src={imageUrl} 
                                alt={title}
                                onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/200x200/1e293b/34d399?text=Item'; }}
                                className="w-28 h-28 object-contain mb-2 drop-shadow-lg"
                            />
                            <div className="text-2xl font-black text-emerald-400">{price}</div>
                        </div>

                        {/* Scratchable Layer */}
                        <canvas 
                            ref={canvasRef}
                            width={300}
                            height={300}
                            className={`absolute inset-0 w-full h-full cursor-crosshair transition-opacity duration-700 ${isRevealed ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}
                            onMouseDown={startDrawing}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onMouseMove={scratch}
                            onTouchStart={startDrawing}
                            onTouchEnd={stopDrawing}
                            onTouchMove={scratch}
                        />
                    </div>

                    <h3 className="text-2xl font-bold text-white mb-2">{title}</h3>
                    <p className="text-slate-400 text-sm mb-6 leading-relaxed">{desc}</p>

                    {isRevealed && (
                        <div className="animate-fade-in w-full mt-auto">
                            <p className="text-sm text-emerald-200 bg-emerald-950/80 p-3 rounded-xl border border-emerald-500/30">
                                {tag}
                            </p>
                        </div>
                    )}

                    {!isRevealed && (
                        <button 
                            onClick={onReveal}
                            className="mt-auto text-xs font-bold uppercase tracking-widest text-emerald-400 hover:text-white underline transition-colors"
                        >
                            Auto-Reveal Item
                        </button>
                    )}
                </div>
            );
        };

        const App = () => {
            const [stage, setStage] = useState(0); 
            const [revealed, setRevealed] = useState(false);
            const [barterAnswers, setBarterAnswers] = useState({});
            const [triviaAnswers, setTriviaAnswers] = useState({});

            const nextStage = () => {
                setStage(stage + 1);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            if (stage === 0) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                        <BackgroundCoins />
                        <div className="max-w-4xl mx-auto fade-in">
                            <div className="mb-6 inline-block">
                                <i className="fas fa-wallet text-6xl text-transparent bg-clip-text bg-gradient-to-br from-emerald-400 to-teal-600"></i>
                            </div>
                            <h3 className="text-sm font-bold tracking-[0.3em] uppercase text-emerald-500 mb-4">Unit 2 Introduction</h3>
                            <h1 className="font-display text-5xl md:text-8xl font-black mb-6 text-white leading-tight">
                                What is the value of <br/>
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-green-500 to-teal-500 glow-text">MONEY?</span>
                            </h1>
                            <p className="text-xl md:text-2xl text-slate-300 mb-12 font-light max-w-2xl mx-auto leading-relaxed">
                                Before we open the book, let's test your instincts about wealth, trade, and the bizarre things humans choose to value.
                            </p>
                            <button 
                                onClick={nextStage}
                                className="group relative inline-flex items-center justify-center px-10 py-5 font-bold text-white transition-all duration-300 bg-slate-900 border-2 border-emerald-500 rounded-full hover:bg-emerald-600 focus:outline-none shadow-[0_0_20px_rgba(52,211,153,0.3)] hover:shadow-[0_0_40px_rgba(52,211,153,0.6)] hover:-translate-y-1"
                            >
                                <span className="mr-3 text-lg tracking-wider font-display uppercase">Start the Simulation</span>
                                <i className="fas fa-arrow-right transform group-hover:translate-x-2 transition-transform text-emerald-400 group-hover:text-white"></i>
                            </button>
                        </div>
                    </div>
                );
            }

            if (stage === 1) {
                const handleTrivia = (qId, idx) => {
                    if (triviaAnswers[qId] !== undefined) return;
                    setTriviaAnswers({...triviaAnswers, [qId]: idx});
                };

                const triviaQuestions = [
                    { id: 1, q: "What is US 'paper' money actually made of?", opts: ["Tree wood", "Cotton and linen", "Recycled plastic"], ans: 1, fact: "Surprise! US bills are 75% cotton and 25% linen. That's why they don't easily fall apart in the washing machine!" },
                    { id: 2, q: "Which of these is printed MORE every year?", opts: ["Monopoly game money", "Real US Dollars", "Euro Banknotes"], ans: 0, fact: "Parker Brothers prints about $30 billion in Monopoly money each year, far more than the US mint prints in real currency!" },
                    { id: 3, q: "Where was the very first paper money invented?", opts: ["Ancient Egypt", "The Roman Empire", "China"], ans: 2, fact: "Paper money was first developed in China during the Tang Dynasty (around 740 AD) to avoid carrying heavy metal coins." }
                ];

                return (
                    <div className="min-h-screen p-6 md:p-12 pb-24 flex flex-col justify-center">
                        <div className="max-w-6xl mx-auto w-full fade-in">
                            <header className="text-center mb-12 border-b border-slate-800 pb-8">
                                <h4 className="text-emerald-500 font-bold tracking-[0.2em] uppercase mb-3">Phase 1: Money Trivia</h4>
                                <h2 className="text-4xl md:text-5xl font-display font-black text-white mb-4">Fact or Fiction?</h2>
                                <p className="text-slate-300 text-lg max-w-2xl mx-auto">
                                    Before we talk about the value of money, let's see how much you actually know about it! Guess the answers below.
                                </p>
                            </header>

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 slide-up">
                                {triviaQuestions.map((q) => (
                                    <div key={q.id} className="bg-slate-900/90 border border-slate-700 p-6 rounded-3xl shadow-xl flex flex-col hover:border-emerald-500/30 transition-colors">
                                        <div className="w-12 h-12 bg-emerald-900/50 rounded-full flex items-center justify-center mb-4 text-emerald-400 text-xl border border-emerald-500/30">
                                            <i className="fas fa-question"></i>
                                        </div>
                                        <p className="text-lg text-white font-medium mb-6 flex-grow">{q.q}</p>
                                        <div className="space-y-3 mb-6">
                                            {q.opts.map((opt, optIdx) => {
                                                const isSelected = triviaAnswers[q.id] === optIdx;
                                                const isAnswered = triviaAnswers[q.id] !== undefined;
                                                const isCorrect = optIdx === q.ans;
                                                
                                                let btnClass = "w-full text-left p-4 rounded-xl font-bold border transition-all text-sm ";
                                                
                                                if (!isAnswered) {
                                                    btnClass += "bg-slate-800 border-slate-600 text-slate-300 hover:bg-slate-700 hover:border-emerald-500/50";
                                                } else {
                                                    if (isCorrect) btnClass += "bg-emerald-600 border-emerald-400 text-white shadow-[0_0_15px_rgba(52,211,153,0.3)]";
                                                    else if (isSelected) btnClass += "bg-red-900/50 border-red-500 text-red-200 opacity-70";
                                                    else btnClass += "bg-slate-800 border-slate-700 text-slate-500 opacity-50";
                                                }

                                                return (
                                                    <button 
                                                        key={optIdx}
                                                        onClick={() => handleTrivia(q.id, optIdx)}
                                                        disabled={isAnswered}
                                                        className={btnClass}
                                                    >
                                                        {opt}
                                                        {isAnswered && isCorrect && <i className="fas fa-check float-right mt-1 text-emerald-200"></i>}
                                                        {isAnswered && isSelected && !isCorrect && <i className="fas fa-times float-right mt-1 text-red-300"></i>}
                                                    </button>
                                                )
                                            })}
                                        </div>
                                        
                                        {triviaAnswers[q.id] !== undefined && (
                                            <div className="mt-auto animate-fade-in bg-slate-950 p-4 rounded-xl border-l-4 border-emerald-500">
                                                <p className="text-sm text-slate-300"><span className="text-emerald-400 font-bold">Fun Fact:</span> {q.fact}</p>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>

                            <div className="mt-12 text-center slide-up delay-2">
                                <button 
                                    onClick={nextStage}
                                    disabled={Object.keys(triviaAnswers).length < 3}
                                    className={`px-12 py-4 rounded-full font-bold text-lg transition-all transform ${
                                        Object.keys(triviaAnswers).length === 3
                                        ? 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-[0_0_20px_rgba(79,70,229,0.5)] hover:scale-105'
                                        : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                                    }`}
                                >
                                    Continue to Phase 2 <i className="fas fa-arrow-right ml-2"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (stage === 2) {
                return (
                    <div className="min-h-screen p-6 md:p-12 pb-24 flex items-center justify-center">
                        <div className="max-w-5xl mx-auto w-full fade-in">
                            <header className="text-center mb-12 border-b border-slate-800 pb-8">
                                <h4 className="text-emerald-500 font-bold tracking-[0.2em] uppercase mb-3">Phase 2: The Value Test</h4>
                                <h2 className="text-4xl md:text-5xl font-display font-black text-white mb-4">Trash or Treasure?</h2>
                                <p className="text-slate-300 text-lg max-w-2xl mx-auto">
                                    Scratch off the protective coating below to uncover the true auction prices of these unique collectibles!
                                </p>
                            </header>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 slide-up">
                                <ScratchItemCard 
                                    title="Item A: Prototype Figurine"
                                    desc="A rare test piece molded in red plastic, never sold in retail stores. Cost to manufacture: $0.05."
                                    imageUrl="https://images.unsplash.com/photo-1608889175123-8ee362201f81?q=80&w=400&auto=format&fit=crop"
                                    price="$10,000+"
                                    tag="TREASURE! High collector demand makes this tiny piece exceptionally valuable."
                                    isRevealed={revealed}
                                    onReveal={() => setRevealed(true)}
                                />

                                <ScratchItemCard 
                                    title="Item B: Vintage Ceramic Cookie Jar"
                                    desc="A decorative kitchen jar owned and collected by renowned pop artist Andy Warhol in the 1980s."
                                    imageUrl="https://chairish-prod.freetls.fastly.net/image/product/sized/32ea28c7-73c5-4c5e-b0a5-04962c4113f1/vintage-brown-and-tan-americana-crockery-vessel-or-cookie-jar-8665?aspect=fit&width=640&height=640"
                                    price="$200"
                                    tag="LOST VALUE! While once valued near $23,000, market tastes shifted significantly."
                                    isRevealed={revealed}
                                    onReveal={() => setRevealed(true)}
                                />
                            </div>

                            <div className="mt-12 text-center slide-up delay-2">
                                {!revealed ? (
                                    <button 
                                        onClick={() => setRevealed(true)}
                                        className="px-12 py-4 rounded-full font-bold text-lg bg-emerald-600 hover:bg-emerald-500 text-white shadow-[0_0_20px_rgba(52,211,153,0.5)] transition-all"
                                    >
                                        Auto-Reveal All Prices
                                    </button>
                                ) : (
                                    <div className="animate-fade-in">
                                        <p className="text-xl text-white font-medium mb-6">
                                            <i className="fas fa-info-circle text-emerald-400 mr-2"></i>
                                            Lesson: <span className="italic">"One person's trash is another person's treasure."</span>
                                        </p>
                                        <button 
                                            onClick={nextStage}
                                            className="bg-indigo-600 hover:bg-indigo-500 text-white px-12 py-4 rounded-full font-bold text-lg shadow-[0_0_20px_rgba(79,70,229,0.5)] transition-all transform hover:scale-105"
                                        >
                                            Continue to Phase 3 <i className="fas fa-arrow-right ml-2"></i>
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            if (stage === 3) {
                const handleBarterClick = (q, answer) => {
                    setBarterAnswers({...barterAnswers, [q]: answer});
                }

                return (
                    <div className="min-h-screen p-6 md:p-12 pb-24 flex items-center">
                        <div className="max-w-6xl mx-auto w-full fade-in">
                            <header className="mb-10 text-center">
                                <h4 className="text-emerald-500 font-bold tracking-[0.2em] uppercase mb-2">Phase 3: Money Matters</h4>
                                <h2 className="text-4xl font-display font-black text-white">Life Without Currency</h2>
                                <p className="text-slate-300 mt-4 text-lg">If bills and coins disappeared, how would we survive? Choose the correct vocabulary word.</p>
                            </header>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 slide-up">
                                <div className="bg-slate-900/90 border border-slate-700 p-8 rounded-3xl shadow-xl hover:border-emerald-500/50 transition-all">
                                    <div className="w-16 h-16 bg-blue-900/50 rounded-full flex items-center justify-center mb-6 text-blue-400 text-2xl border border-blue-500/30">
                                        <i className="fas fa-balance-scale"></i>
                                    </div>
                                    <p className="text-xl text-white leading-relaxed mb-8">
                                        You are a lawyer. You need your garden fixed. A gardener needs legal help. You decide to exchange one hour of legal work for one hour of gardening.
                                        <br/><br/>
                                        This system, where no money is used, is called:
                                    </p>
                                    <div className="flex flex-col gap-3">
                                        {['a transaction', 'bartering', 'a currency'].map((opt) => (
                                            <button 
                                                key={opt}
                                                onClick={() => handleBarterClick(1, opt)}
                                                className={`p-4 rounded-xl font-bold border transition-all text-left ${
                                                    barterAnswers[1] === opt && opt === 'bartering' ? 'bg-emerald-600 border-emerald-400 text-white' :
                                                    barterAnswers[1] === opt ? 'bg-red-900/50 border-red-500 text-red-200' :
                                                    'bg-slate-800 border-slate-600 text-slate-300 hover:bg-slate-700'
                                                }`}
                                            >
                                                {opt} {barterAnswers[1] === opt && opt === 'bartering' && <i className="fas fa-check float-right mt-1"></i>}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-900/90 border border-slate-700 p-8 rounded-3xl shadow-xl hover:border-emerald-500/50 transition-all delay-1">
                                    <div className="w-16 h-16 bg-purple-900/50 rounded-full flex items-center justify-center mb-6 text-purple-400 text-2xl border border-purple-500/30">
                                        <i className="fas fa-comments-dollar"></i>
                                    </div>
                                    <p className="text-xl text-white leading-relaxed mb-8">
                                        You are in the Grand Bazaar in Istanbul. The rugs do not have price tags. You want a lower price, so you discuss it with the seller until you both agree.
                                        <br/><br/>
                                        What are you doing to the price?
                                    </p>
                                    <div className="flex flex-col gap-3">
                                        {['consuming', 'swapping', 'negotiating'].map((opt) => (
                                            <button 
                                                key={opt}
                                                onClick={() => handleBarterClick(2, opt)}
                                                className={`p-4 rounded-xl font-bold border transition-all text-left ${
                                                    barterAnswers[2] === opt && opt === 'negotiating' ? 'bg-emerald-600 border-emerald-400 text-white' :
                                                    barterAnswers[2] === opt ? 'bg-red-900/50 border-red-500 text-red-200' :
                                                    'bg-slate-800 border-slate-600 text-slate-300 hover:bg-slate-700'
                                                }`}
                                            >
                                                {opt} {barterAnswers[2] === opt && opt === 'negotiating' && <i className="fas fa-check float-right mt-1"></i>}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="mt-12 text-center slide-up delay-2">
                                <button 
                                    onClick={nextStage}
                                    disabled={!barterAnswers[1] || !barterAnswers[2]}
                                    className={`px-12 py-4 rounded-full font-bold text-lg transition-all transform ${
                                        barterAnswers[1] && barterAnswers[2]
                                        ? 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-[0_0_20px_rgba(79,70,229,0.5)] hover:scale-105'
                                        : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                                    }`}
                                >
                                    Continue to Phase 4 <i className="fas fa-arrow-right ml-2"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (stage === 4) {
                return (
                    <div className="min-h-screen p-6 md:p-12 flex items-center">
                        <div className="max-w-6xl mx-auto w-full fade-in">
                            
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                                <div className="order-2 lg:order-1 slide-up">
                                    <div className="relative rounded-3xl overflow-hidden shadow-2xl border-4 border-slate-800 bg-black aspect-video flex flex-col items-center justify-center group cursor-pointer">
                                        <div className="absolute inset-0 bg-gradient-to-tr from-emerald-900/40 to-blue-900/40 mix-blend-overlay"></div>
                                        <i className="fas fa-play-circle text-7xl text-white opacity-80 group-hover:opacity-100 group-hover:scale-110 transition-all z-10 drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]"></i>
                                        <p className="absolute bottom-6 left-6 font-display font-bold text-2xl z-10"><span className="text-red-500">FACT</span>FLIX: Why does money exist?</p>
                                    </div>
                                    
                                    <div className="mt-8 bg-slate-900/90 p-8 rounded-2xl border border-slate-700 shadow-lg relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-2 h-full bg-emerald-500"></div>
